[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    unit: Pruebas unitarias rapidas y aisladas
    integration: Pruebas de integracion que requieren la API REST
    slow: Pruebas de rendimiento (benchmarks, minado, cadenas largas)
    security: Pruebas de seguridad y ataques
asyncio_mode = auto
